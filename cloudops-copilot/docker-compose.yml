version: "3.8"

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - AWS_REGION=us-east-1
      - FASTAPI_HOST=0.0.0.0
      - FASTAPI_PORT=8000
    env_file:
      - .env
    command: python -m uvicorn api.server:app --host 0.0.0.0 --port 8000 --reload

  ui:
    build: .
    ports:
      - "8501:8501"
    environment:
      - AWS_REGION=us-east-1
      - STREAMLIT_PORT=8501
    env_file:
      - .env
    depends_on:
      - api
    command: streamlit run ui/app.py --server.port 8501 --server.address 0.0.0.0

volumes:
  app_data:
